
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지뢰찾기</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game">
    <h1>💣 지뢰찾기</h1>

    <div class="info">
      <span id="mines">🚩 남은 지뢰: 10</span>
      <span id="timer">⏱ 시간: 0초</span>
    </div>

    <p id="message">칸을 클릭해서 게임을 시작하세요!</p>

    <div id="board" class="board"></div>

    <button id="restart">다시 시작</button>
  </main>
</body>
</html>
